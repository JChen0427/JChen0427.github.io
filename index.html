<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>First Website Study</title>
        <style type="text/css">
            body{
                background-color: #F9E2AF;
                margin: 0;
            }
            div#main-container{
                background-color:#FFF1E6;
                width: 85vw;
                margin:auto;
                padding: 2em 2em 2em 2em;
                height: auto;
            }
            h1 {
                color: chocolate;
                font-family: 'Courier New', Courier, monospace;
                font-size: 2.5em;
                margin-top; 0em;
            }
            p {
                color: darkgoldenrod;
                font-family: 'times new roman', times, serif;
                font-size: 1.5em;
            }
            a {
                color: coral;
                text-decoration: none;
            }
            /* my comment */
            a:hover {
                color: darkblue;
            }
            a:focus{
                color:brown;
            }
            img{
                width: 100%;
            }
            div#intro{
                background-color: #F3EBDD;
                width: 85vw;
                margin:auto;
                padding: 2em 2em 2em 2em;
                height:auto;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                background-image: url("background01.jpeg");
                background-repeat: repeat;
                background-size: 600px auto;
                background-position: top left;
                gap: 40px;
                border: 5px solid #84A59D;
                box-shadow:
                6px 6px 0 #F6DDA6,
                -6px -6px 0 #F6DDA6;
                box-sizing: border-box;
            }
            h2 {
                color:#84A59D;
                font-size: 7em;
                font-family:"Jersey 25", sans-serif;
                margin-top: 30px;
                margin-bottom: 30px;
                display: flex;
                align-items: center;
            }
            .name-gif {
                width: 70px;
                height: auto;
                margin-left: 15px;
            }
            .side-nav{
                display: flex;
                flex-direction: column;
                width: 470px;
                gap: 20px;
                font-size: 3em;
                flex-shrink: 0;
                position: relative;
                background-color: #F6DDA6;
                border: 5px solid #84A59D;
                padding: 45px 35px 35px 55px;
                box-sizing: border-box;
                align-self: flex-start;    
            }
            .menu-title {
                position: absolute;
                top: -25px;
                left: 25px;
                padding: 0 10px;
                background-color: #F6DDA6;
                color: #84A59D;
                font-family: "Pixelify Sans", sans-serif;
                font-size: 0.7em;
            }
            .side-nav a{
                color: #D98E73;
                text-decoration: none;
                font-family:"Pixelify Sans", sans-serif;
                white-space: nowrap;
            }
            .side-nav a:hover {
                color: #84A59D;
            }
            .gallery {
                display: grid;
                grid-template-columns: 250px 250px;
                gap: 30px;
                width: fit-content;
                background-color: #D8C7AC;
                padding: 30px;
            }
            #intro {
                display: flex;
                gap: 60px;
            }
            .page-box {
                background-color: #F7A9A8;
                width: 95%;
                margin: 30px auto;
                padding: 40px;
                box-sizing: border-box
            }
            .stars-bottom {
                text-align: center;
            }
            .star01 {
                width: 90%;
                max-width: 1250px;
                height: auto;
                display: block;
                margin: 0 auto;
            }
            .contact {
                text-align: center;
                padding: 15px 20px 50px;
                margin-top: -30px;
            }
            .contact h3 {
                font-family: "Jersey 25", sans-serif;
                font-size: 32px;
                text-align: center;
                margin-left: 0;
                margin-right: 0;
                color:#84A59D;
            }
            .contact-links {
                display: flex;
                justify-content: center;
                gap: 30px;
            }
            .contact-links a {
                color: #527A78;
                text-decoration: none;
                font-size: 20px;
                font-family: "Pixelify Sans", sans-serif;
            }
            .contact-links a:hover {
                color: #FFE39A;
            }
            .skills {
                text-align: center;
                padding: 10px 20px 30px;
            }
            .skills h4 {
                font-size: 32px;
                margin-bottom: 20px;
                margin-top: 0;
                font-family: "Jersey 25", sans-serif;
                color:#84A59D;
            }
            .skill-list {
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            .skill-list span {
                background-color: #f3b6c8;
                padding: 8px 15px;
                border: 2px solid #8f596b;
                box-shadow: 3px 3px 0 #8f596b;
                font-family: "Pixelify Sans", sans-serif;
                font-size: 20px;
                cursor: default;
                color: #D98E73;
            }
            .skill-list span:hover {
                background-color: #8f596b;
                color: #fbe5eb;
            }
            .side-nav a:hover {
                color: #84A59D;
                transform: translateX(5px);
            }
            .side-nav a::before {
                content: "★ ";
                opacity: 0;
            }
            .side-nav a:hover::before {
                opacity: 1;
            }
        </style>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="main-container">

            <!--comment -->
            <p> Hello hello hello</p>

        <div class="page-box">

            <div id="intro">
                <nav class="side-nav">
                    <div class="menu-title">MENU</div>
                        <a href="https://www.google.com/?zx=1788466446995">HOME</a>
                        <a href="https://www.google.com/?zx=1788466446995">ILLUSTRATION</a>
                        <a href="https://www.google.com/?zx=1788466446995">ANIMATION</a>
                        <a href="https://www.google.com/?zx=1788466446995">ABOUT</a>
                </nav>
                <div class="gallery">
                    <img src="01.jpg">
                    <img src="03.jpg">
                    <img src="04.jpg">
                    <img src="05.jpg">
                </div>
            </div>
                <section class="skills">
                    <h4>Software / Skills</h4>
                    <div class="skill-list">
                        <span>Photoshop</span>
                        <span>Unity</span>
                        <span>3ds Max</span>
                        <span>Procreate</span>
                    </div>
                </section>
                <div class="stars-bottom">
                    <img src="star01.gif" alt="star01" class="star01">
                </div>
                <section class="contact">
                    <h3>CONTACT ME</h3>
                    <div class="contact-links">
                    <a href="#">Email</a>
                    <a href="#">Instagram</a>

                </section>
         </div>   
        
    </body>
</html>
